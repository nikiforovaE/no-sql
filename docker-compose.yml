services:
  eventhub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventhub
    ports:
      - ${APP_PORT}:${APP_PORT}
    env_file: .env.local
    environment:
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT}
      REDIS_HOST: ${REDIS_HOST}
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      cassandra-setup:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_HOST}
    env_file: .env.local
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  mongos:
    image: mongo:8.0
    container_name: ${MONGODB_HOST}
    env_file: .env.local
    command: mongos --configdb configReplSet/configsvr01:${MONGODB_PORT} --port ${MONGODB_PORT} --bind_ip_all
    ports:
      - ${MONGODB_PORT}:${MONGODB_PORT}

  configsvr01:
    image: mongo:8.0
    env_file: .env.local
    container_name: configsvr01
    command: mongod --configsvr --replSet configReplSet --port ${MONGODB_PORT} --bind_ip_all
    volumes:
      - config_data:/data/db

  shard01-a:
    image: mongo:8.0
    env_file: .env.local
    container_name: shard01-a
    command: mongod --shardsvr --replSet shard01RS --port ${MONGO_SHARD_PORT} --bind_ip_all
  shard01-b:
    env_file: .env.local
    image: mongo:8.0
    container_name: shard01-b
    command: mongod --shardsvr --replSet shard01RS --port ${MONGO_SHARD_PORT} --bind_ip_all
  shard01-c:
    image: mongo:8.0
    env_file: .env.local
    container_name: shard01-c
    command: mongod --shardsvr --replSet shard01RS --port ${MONGO_SHARD_PORT} --bind_ip_all

  shard02-a:
    image: mongo:8.0
    env_file: .env.local
    container_name: shard02-a
    command: mongod --shardsvr --replSet shard02RS --port ${MONGO_SHARD_PORT} --bind_ip_all
  shard02-b:
    image: mongo:8.0
    env_file: .env.local
    container_name: shard02-b
    command: mongod --shardsvr --replSet shard02RS --port ${MONGO_SHARD_PORT} --bind_ip_all
  shard02-c:
    image: mongo:8.0
    env_file: .env.local
    container_name: shard02-c
    command: mongod --shardsvr --replSet shard02RS --port ${MONGO_SHARD_PORT} --bind_ip_all

  mongo-setup:
    image: mongo:8.0
    env_file: .env.local
    container_name: mongo-setup
    volumes:
      - ./docker/mongo-init.sh:/mongo-init.sh:ro
    entrypoint: [ "/bin/bash", "/mongo-init.sh" ]
    depends_on:
      - mongos
      - shard01-a
      - shard02-a

  cassandra:
    image: cassandra:latest
    container_name: ${CASSANDRA_HOSTS}
    environment:
      - CASSANDRA_CLUSTER_NAME=IoTCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_SEEDS=cassandra
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=256M
    mem_limit: 4g
    env_file: .env.local
    ports:
      - ${CASSANDRA_PORT}:${CASSANDRA_PORT}
    healthcheck:
      test: [ "CMD", "nodetool", "status" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  cassandra-setup:
    image: cassandra:latest
    container_name: cassandra-setup
    depends_on:
      cassandra:
        condition: service_healthy
    env_file: .env.local
    volumes:
      - ./docker/cassandra-init.cql:/cassandra-init.cql
    entrypoint: >
      /bin/bash -c "sed 's/\$${CASSANDRA_KEYSPACE}/${CASSANDRA_KEYSPACE}/g' /cassandra-init.cql > /tmp/init.cql 
      && cqlsh ${CASSANDRA_HOSTS} -f /tmp/init.cql"

volumes:
  config_data: